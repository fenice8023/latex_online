name: Compile LaTeX with TeX Live 2026

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required packages via tlmgr
        run: |
          tlmgr update --self 2>/dev/null || true
          tlmgr install ltx-talk algorithm2e stix2-otf ctex fandol collection-langchinese 2>/dev/null || true

      - name: Compile all .tex files
        run: |
          find . -name "*.tex" -not -path "./.git/*" | while read f; do
            dir=$(dirname "$f")
            name=$(basename "$f" .tex)
            echo "=== Compiling $f ==="
            cd "$GITHUB_WORKSPACE/$dir"
            lualatex -interaction=nonstopmode "$name.tex" || true
            lualatex -interaction=nonstopmode "$name.tex"
            lualatex -interaction=nonstopmode "$name.tex"
            cd "$GITHUB_WORKSPACE"
          done

      - name: Upload all PDFs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdfs
          path: "**/*.pdf"
          retention-days: 30

  pages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled PDFs
        uses: actions/download-artifact@v4
        with:
          name: compiled-pdfs

      - name: Generate index page
        run: |
          echo '<html><head><meta charset="utf-8"><title>LaTeX PDFs</title></head><body><h1>Compiled PDFs</h1><ul>' > index.html
          find . -name "*.pdf" | sort | while read f; do
            f="${f#./}"
            echo "<li><a href=\"$f\">$f</a></li>" >> index.html
          done
          echo '</ul></body></html>' >> index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true
