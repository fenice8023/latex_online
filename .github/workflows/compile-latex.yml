name: Compile LaTeX with TeX Live 2026

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live 2026
        uses: teatimeguest/setup-texlive-action@v3
        with:
          version: 2026
          packages: >-
            scheme-small
            ltx-talk
            ctex
            fandol
            algorithm2e
            stix2-otf
            collection-langchinese
            collection-latexextra

      - name: Show TeX Live version
        run: |
          lualatex --version
          kpsewhich ltx-talk.cls

      - name: Compile 1.tex (first pass)
        continue-on-error: true
        run: |
          lualatex -interaction=nonstopmode 1.tex

      - name: Compile 1.tex (second pass)
        run: |
          lualatex -interaction=nonstopmode 1.tex

      - name: Compile 1.tex (third pass)
        run: |
          lualatex -interaction=nonstopmode 1.tex

      - name: Show log on failure
        if: failure()
        run: |
          tail -80 1.log 2>/dev/null || echo "No log found"

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdf
          path: 1.pdf
          retention-days: 30
