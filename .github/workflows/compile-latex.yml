name: Compile LaTeX with TeX Live 2026

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required packages via tlmgr
        run: |
          tlmgr update --self 2>/dev/null || true
          tlmgr install ltx-talk algorithm2e stix2-otf 2>/dev/null || true

      - name: Compile 1.tex (first pass)
        continue-on-error: true
        run: lualatex -interaction=nonstopmode 1.tex

      - name: Compile 1.tex (second pass)
        run: lualatex -interaction=nonstopmode 1.tex

      - name: Compile 1.tex (third pass)
        run: lualatex -interaction=nonstopmode 1.tex

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdf
          path: 1.pdf
          retention-days: 30
