name: Compile LaTeX with TeX Live 2026

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnose TeX Live environment
        run: |
          echo "=== TeX Live version ==="
          lualatex --version | head -3
          cat /etc/os-release 2>/dev/null | head -3
          echo "=== Times fonts available ==="
          fc-list | grep -i "times\|termes" | head -10 || echo "No Times fonts found"
          echo "=== CJK fonts available ==="
          fc-list | grep -i "fandol\|cjk\|han\|noto.*cjk\|song\|hei\|kai" | head -10 || echo "No CJK fonts found"
          echo "=== STIX Two Math ==="
          fc-list | grep -i "stix" | head -5 || echo "No STIX fonts found"

      - name: Install required packages via tlmgr
        run: |
          tlmgr update --self 2>/dev/null || true
          tlmgr install ltx-talk algorithm2e stix2-otf ctex fandol collection-langchinese 2>/dev/null || true
          echo "=== Checking key files ==="
          kpsewhich ltx-talk.cls || echo "ltx-talk.cls MISSING"
          kpsewhich ctex.sty || echo "ctex.sty MISSING"

      - name: Compile 1.tex (first pass)
        continue-on-error: true
        run: lualatex -interaction=nonstopmode 1.tex

      - name: Compile 1.tex (second pass)
        run: lualatex -interaction=nonstopmode 1.tex

      - name: Compile 1.tex (third pass)
        run: lualatex -interaction=nonstopmode 1.tex

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdf
          path: 1.pdf
          retention-days: 30

      - name: Prepare PDF for GitHub Pages
        run: |
          mkdir -p public
          cp 1.pdf public/
          echo '<html><head><meta http-equiv="refresh" content="0;url=1.pdf"></head><body><a href="1.pdf">Download PDF</a></body></html>' > public/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
